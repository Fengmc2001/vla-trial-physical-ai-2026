[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "vla-trial"
version = "0.1.0"
description = "尝试VLA: offline Qwen, Genesis, and CPU-only preparation UI"
requires-python = ">=3.11,<3.14"
dependencies = []

[project.scripts]
vla-trial = "vla_trial.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
